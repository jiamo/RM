    revalidation: docs/goal/evidence/2026-08-28-m2-lindelof-from-rh.md
    latest_update: "2026-08-28 DONE_WEAK: RiemannHypothesis/LindelofFromRH.lean deduces from ZetaStripForm, for every fixed delta > 0, the Lindelof growth bound off the critical line. Under the hypothesis zetaPoleFree s = (s-1) zeta(s) has no zero in re s > 1/2, so exists_holomorphic_log_halfPlane gives a holomorphic branch F of its logarithm there (exists_logBranch_of_zetaStripForm); logShift F t z = F(3 + i t + z) - F(3 + i t) is the branch normalized at the centre s0 = 3 + i t, so that its real part is the difference of the two logarithms of ||zetaPoleFree|| and the branch constant cancels. The centre is controlled by ||zetaPoleFree s0|| >= t/2 (from ||zeta(3 + i t)|| >= 1/2) and <= 2(t+3). On ||z|| < 1 the real part is at most 2, and Borel-Caratheodory (Complex.borelCaratheodory_zero, M = 2, R = 1) gives norm_logShift_le_four, ||G|| <= 4 on ||z|| <= 1/2; on ||z|| < 5/2 the polynomial bound norm_riemannZeta_le_sq gives real part at most 6 log t, and Borel-Caratheodory (M = 6 log t, R = 5/2) gives norm_logShift_le_log_div, ||G|| <= 60 log t/delta on ||z|| <= 5/2 - delta/2. Hadamard's three circles (M2-THREE-CIRCLES) interpolates between the radii 1/2 and 5/2 - delta/2: norm_logShift_le_rpow bounds ||G|| by 4 (60 log t/delta)^lambda0 with lambda0 = log(5 - 2 delta)/log(5 - delta) < 1. Exponentiating at z = sigma - 3 gives norm_riemannZeta_le_exp_of_zetaStripForm for 1/2 + delta <= sigma <= 5/2 and t >= 100, and since lambda0 < 1 the exponent is eventually below eps log t, which gives exists_bound_riemannZeta_of_zetaStripForm: for every delta > 0 and eps > 0 there are C and T0 with ||zeta(s)|| <= C (im s)^eps whenever re s >= 1/2 + delta and im s >= T0. Both theorems assume ZetaStripForm and are listed in docs/goal/conditional-theorems.txt; both are pinned in scripts/revalidation.lean. No sorry; the audit script passes."
    open_boundary: "The critical line itself is not covered, so LindelofHypothesis of RiemannHypothesis/LindelofDensity.lean - which asks for the bound uniformly for re s >= 1/2 - is not proved, and the row does not close Littlewood's theorem. The bound degenerates as delta -> 0: the interpolation exponent lambda0 = log(5 - 2 delta)/log(5 - delta) tends to 1 and the threshold T0 tends to infinity. Reaching the line needs log zeta(1/2 + i t) = O(log t / log log t), that is three circles with radii shrinking with t, which is not formalized. Everything here is conditional on the Riemann hypothesis and yields nothing unconditional. The constants 100, 3, 4, 60 and the radii 1/2 and 5/2 are explicit but not optimized."
