  - id: M1-WEYL-BADLY-APPROXIMABLE
    priority: P1
    status: DONE_WEAK
    track: analysis
    title: "An unconditional rate for the quadratic Weyl sum: badly approximable coefficients, and the explicit example sqrt 2 / 2"
    latest_evidence: docs/goal/evidence/2026-08-29-m1-weyl-badly-approximable.md
    revalidation: docs/goal/evidence/2026-08-29-m1-weyl-badly-approximable.md
    latest_update: "2026-08-29 DONE_WEAK: RiemannHypothesis/WeylBadlyApproximable.lean removes, for a natural Diophantine class, the hypothesis that M1-WEYL-QUADRATIC-QUANTITATIVE and M1-WEYL-MIN-SUM leave to the caller, namely the existence of a rational approximation with a denominator in a prescribed range, and so gives the first effective rate in the repository for a fixed irrational coefficient. normSq_quadSum_le_of_den_le restates the bound of M1-WEYL-MIN-SUM as ||sum_{0 <= n < N} e(alpha n^2)||^2 <= 16 N^2 / q + 26 N (1 + log N), valid for every coprime approximation |2 alpha - a/q| <= 1/q^2 with 0 < q <= N. exists_coprime_approx is Dirichlet's theorem in numerator/denominator form, from mathlib's Real.exists_rat_abs_sub_le_and_den_le: for every n >= 1 there are a and q with 0 < q <= n, gcd(a,q) = 1 and |x - a/q| <= 1/(q(n+1)). BadlyApproximable x says that |x - a/q| >= c/q^2 for some c > 0 and every fraction, the condition satisfied by the quadratic irrationals and by the irrationals with bounded partial quotients; le_den_of_badlyApproximable observes that it forces the Dirichlet denominator to be large, q >= c(n+1). Taking n = N, both hypotheses of the conditional bound hold, and normSq_quadSum_le_of_badlyApproximable and norm_quadSum_le_of_badlyApproximable give, unconditionally in N, ||sum|| ^2 <= (16/c + 26) N (1 + log N) and ||sum|| <= sqrt((16/c + 26) N (1 + log N)). The class is not empty: sq_ne_two_mul_sq (a^2 = 2q^2 would make sqrt 2 rational) and the factorization |sqrt 2 - a/q| (sqrt 2 + a/q) = |2q^2 - a^2|/q^2 >= 1/q^2 give badlyApproximable_sqrt_two, sqrt 2 is badly approximable with c = 1/4, whence norm_quadSum_sqrt_two_le: ||sum_{0 <= n < N} e((sqrt 2 / 2) n^2)|| <= sqrt(90 N (1 + log N)) for every N >= 1. More generally inv_le_abs_sub_div_of_quadratic proves Liouville's inequality for a quadratic: if A x^2 + B x + C = 0 with A nonzero and x irrational then |x - a/q| >= (1/(|A|(2|x|+1) + |B|))/q^2, because A a^2 + B a q + C q^2 is a nonzero integer (a rational root would force the other root -B/A - a/q, and hence x, to be rational), so badlyApproximable_of_quadratic: every quadratic irrational is badly approximable, and exists_norm_quadSum_le_of_quadratic: whenever 2 alpha is a quadratic irrational there is a K > 0 with ||sum_{0 <= n < N} e(alpha n^2)|| <= sqrt(K N (1 + log N)) for every N >= 1. No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used."
