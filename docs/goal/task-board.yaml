    latest_update: "2026-08-31 DONE_WEAK: RiemannHypothesis/WeylBadlyGeneral.lean closes the part of the open boundary of M1-WEYL-GENERAL that says the unconditional badly approximable form, done for d = 2 in M1-WEYL-BADLY-APPROXIMABLE and for d = 3 in M1-WEYL-CUBIC, is not carried out in general degree. Dirichlet theorem with parameter N (exists_coprime_approx) gives a coprime a/q with q <= N and |d! alpha - a/q| <= 1/(q(N+1)), and le_den_of_badlyApproximable turns the hypothesis c/q^2 <= |d! alpha - a/q| into q >= c(N+1), so the three-term bracket of M1-WEYL-CLASSICAL satisfies 1/q + 1/N + q/N^d <= (1/c + 2)/N. exists_norm_polyPhaseSum_pow_mul_le_of_badlyApproximable therefore gives, for every eps > 0 and c > 0, a C >= 1 with ||sum_(0 <= n < N) e(f n)||^(2^(r+1)) N <= C N^(2^(r+1)) N^eps for every N >= 1 and every polynomial phase f of degree at most d = r + 2 with badly approximable leading coefficient; exists_norm_polyPhaseSum_le_of_badlyApproximable takes 2^(r+1)-th roots and states it as ||sum|| <= C N^(1 - 1/2^(d-1) + eps) with no hypothesis on N; the monomial corollaries exists_norm_monomialSum_pow_mul_le_of_badlyApproximable and exists_norm_monomialSum_le_of_badlyApproximable specialize to the phase alpha n^d, and exists_norm_monomialSum_sqrt_two_le instantiates it at the explicit coefficient alpha = sqrt 2 / d!, for which d! alpha = sqrt 2 is badly approximable with constant 1/4. For d = 2 the exponent 1/2 + eps matches the square-root cancellation of M1-WEYL-BADLY-APPROXIMABLE. No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used."
