    latest_update: "2026-09-06 DONE_WEAK: RiemannHypothesis/Koksma.lean proves what makes the discrepancy of M1-DISCREPANCY the right measure of equidistribution, namely that it controls the error of numerical integration along the sequence. koksma_monotone: for a nondecreasing f on [0,1] - no continuity assumed, jumps allowed - every sequence x and every N >= 1, |(1/N) sum_{n<N} f(fract x_n) - int_0^1 f| <= (f 1 - f 0) D_N(x), quantitatively and with no limit taken. The proof cuts [0,1) into K cells: monotonicity brackets the average between the two step averages built from the values of f at the left and the right endpoints of the cells (sum_stepLeft_le_sum_fract, sum_fract_le_sum_stepRight) and brackets the integral between the corresponding left and right Riemann sums (riemannSum_le_integral_le), which differ by (f 1 - f 0)/K (riemannSum_right_sub_left). Each of the two cell deviation sums sum_j w_j (c_j/N - 1/K) is handled by summation by parts (sum_mul_sub_succ, sum_mul_sub_succ'"'"'), which rewrites it as consecutive differences of f against the deviations S_j of the tail intervals [j/K,1), each at most D_N by le_discrepancy, the differences nonnegative and telescoping to at most f 1 - f 0 (abs_sum_cellDev_le, abs_sum_cellDev_right_le); the boundary terms vanish because S_0 = S_K = 0. Letting K grow removes the (f 1 - f 0)/K. koksma_sub_monotone extends the bound to a difference f = g - h of two nondecreasing functions, with the sum of the two rises, which is the bounded-variation case; koksma_lipschitz is the Lipschitz form, |...| <= 3 L D_N(x). tendsto_average_of_tendsto_discrepancy and tendsto_average_quadratic draw the limiting consequences, the latter for alpha n^2 with alpha irrational via M1-DISCREPANCY-CRITERION. No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used; four statements pinned in scripts/revalidation.lean."
    open_boundary: "The total variation part of this boundary is closed by M1-KOKSMA-VARIATION, which states the inequality for a general function of bounded variation with the constant 2 V(f) - |f 1 - f 0|, and the Lipschitz constant is now sharp, L, by M1-KOKSMA-LIPSCHITZ-SHARP. What remains open is the sharp constant V(f) for a general function of bounded variation. Nothing about zeta is claimed: these are not zeta phases."
