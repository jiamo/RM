    latest_update: "2026-08-27 DONE_WEAK: RiemannHypothesis/VanDerCorputSums.lean closes the gap that the open boundaries of M1-KUSMIN-LANDAU and M1-VAN-DER-CORPUT both named, and that mathlib does not have: Kusmin-Landau needs f' trapped between two consecutive integers on the whole range, and this module splits a general range into such subranges. With e(x) = exp(2 pi i x) and g = f' on [a, a + L], norm_sum_e2pi_le_of_grow proves ||sum_{j < L} e(f(a+j))|| <= 2 (V + 2)((1 + 2/lam) + (2 lam/r + 1)) with V = g(a+L) - g(a), assuming only that g grows at speed at least r > 0. The proof classifies the index j by the pair (floor(g(a+j) + lam), whether g(a+j) >= that floor + lam), so the fibres are the blocks where g is in the good window [k + lam, k + 1 - lam) or in the bad window [k - lam, k + lam) around the integer k; monotonicity of g makes every fibre a contiguous block of indices (cls_eq_of_between), Kusmin-Landau bounds a good fibre by 1 + 2/lam uniformly in its length, a bad fibre has fewer than 2 lam/r + 1 indices because g separates at speed r (sample_gap) and is counted trivially, and at most 2(V + 2) classes occur. norm_sum_e2pi_le_of_grow_sqrt is the balanced choice lam = sqrt(r)/2, valid for 0 < r <= 1, giving 2(V + 2)(2 + 5/sqrt r); norm_sum_e2pi_le_of_deriv_two is the classical second derivative test, obtained from the mean value theorem: r <= f'' <= R on [a, a + L] gives ||sum|| <= 2(R L + 2)(2 + 5/sqrt r), which for R comparable to r is the classical L sqrt r + 1/sqrt r, the exponent pair (1/2, 1/2). norm_sum_e2pi_le_of_deriv_two_neg is the decreasing case, -R <= f'' <= -r, obtained by conjugating every term. norm_sum_e2pi_logPhase_le is the worked instance of the phase of zeta, f(x) = -(t/2pi) log x on the dyadic block [N, 2N), whose second derivative lies between t/(8 pi N^2) and t/(2 pi N^2). No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used."
