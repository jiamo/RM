    open_boundary: "Since 2026-09-03 the rigid sieve level is gone: card_primes_Ico_le_two_pi gives the constant 2 pi + eps for every eps > 0, at the level Q = floor(sqrt y / log y), so what remains of the loss is exactly the factor pi that this repository's large sieve carries in place of the sharp 1; reaching the classical 2 + o(1) needs Selberg's majorant or the Montgomery-Vaughan Hilbert inequality, neither of which is formalized. The explicit constants 13 for log y >= 4 and 9 for log y >= 24 remain the only effective forms: the threshold of the 2 pi + eps form, log y >= (1000/eps)^2 + 10^6, is an artefact of a crude numerical chain and is not sharp. The threshold log y >= 4, that is y >= 55, is an artefact of the same additive loss, so nothing is claimed for shorter intervals. The arithmetic-progression form is now also free of the rigid level: card_primes_Ico_mod_le_of_level runs it at an arbitrary Q >= 2 and card_primes_Ico_mod_le_two_pi gives, for every eps > 0 and uniformly in x, q and a, at most (2 pi + eps)(q/phi(q)) Y / log Y primes with Y = floor(y/q) + 1, against the earlier 4.15 q Y/(phi(q) log floor(sqrt Y)), that is 8.3 of the same shape; what remains between 2 pi and the sharp 2 of Montgomery-Vaughan is again the factor pi of this repository's large sieve. The threshold floor(sqrt(floor(y/q) + 1)) >= 2 is the analogue of log y >= 4 in the interval form. No Bombieri-Vinogradov consequence and no Selberg-type optimization of the weights. Nothing about zeta follows: no zero-free region, no zero-density estimate, no mean value theorem and no zero is located."
