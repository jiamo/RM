    latest_update: "2026-08-26 DONE_WEAK: RiemannHypothesis/VanDerCorput.lean proves the two basic tests for exponential integrals, neither of which is in mathlib. First derivative test (norm_integral_expI_le_of_abs_deriv_ge): if F'' has a constant sign on [a,b] and |F'| >= m > 0 there, then ||int_a^b e^(i F(x)) dx|| <= 4/m, with no dependence on b - a; the proof is integration by parts against G = 1/F', the two boundary terms contributing 1/m each and the total variation of G contributing 2/m. Second derivative test (norm_integral_expI_le_of_deriv_two_ge): if F'' >= r > 0 then the integral is at most 12/sqrt r, with no lower bound assumed on |F'|; the proof splits [a,b] at u = sup of the set where F' <= 0 with a adjoined, so that no intermediate value argument is needed, and applies the first test outside a window of length 4/sqrt r around u. The worked instance is the phase of zeta theory, x^(-i t) = e^(-i t log x): ||int_A^B x^(-i t) dx|| <= 4B/t and <= 12B/sqrt t. Constants 4 and 12 against the classical 4 and 8, not optimized. No sorry; axioms exactly propext, Classical.choice, Quot.sound."
