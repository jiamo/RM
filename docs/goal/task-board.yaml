    latest_update: "2026-08-26 DONE_STRONG: RiemannHypothesis/MethodCeiling.lean makes the boundary of a counting route checkable instead of asserted. WindowCounts is the counting data a route manipulates - N, N_d, N_off, N_on, N_off^m, N_on^m as abstract reals with the split and monotonicity relations. Two constraint systems are singled out, SatisfiesBudget c b (c N <= N_d and N_off <= b N) and SatisfiesBudgetMult b (N_off^m <= b N), and for each the exact ceiling is proved: budget_ceiling says a proportion p is derivable if and only if p <= c - b, and budgetMult_ceiling says the same with 1 - b. The forward direction is the soundness of the route and the reverse is a saturating witness, which is what makes the number a ceiling rather than a bound. With the repository's own constants c = 5/6 and b = 0.13136 the two ceilings are exactly the 0.70197... and the 0.86864 the repository proves, and eighty_percent_not_derivable_from_budget shows that 80 % is not derivable on the first route, while budget_eighty_percent_iff records what it would take: c >= 4/5 + b = 0.93136. No sorry; axioms exactly propext, Classical.choice, Quot.sound; the module depends on no unproved Prop of the repository."
