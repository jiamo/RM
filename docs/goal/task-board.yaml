  - id: M2-CORPUS-CEILING
    priority: P1
    status: DONE_STRONG
    track: governance/analysis
    title: "Compute the best bound derivable from all of the repository's unconditional facts at once"
    latest_evidence: docs/goal/evidence/2026-08-30-m2-corpus-ceiling.md
    revalidation: docs/goal/evidence/2026-08-30-m2-corpus-ceiling.md
    latest_update: "2026-08-30 DONE_STRONG: RiemannHypothesis/CorpusCeiling.lean extends M2-METHOD-CEILING from one route to the whole corpus. ZeroCorpus theta is the cumulative counting data of the zeroes over (0, T] - all zeroes with multiplicity, the distinct ones, the on-line and the off-line ones, and the off-line ones at distance at least delta from the critical line - with one field for each unconditional fact this repository proves about them: the mollifier proportion (sixty_seven_percent_on_critical_line, theta = 0.33), the Riemann-von Mangoldt formula (exists_abs_windowCount_zero_sub_main_le), the Carlson power saving (exists_ncard_zerosOffCriticalLine_le_rpow), the quadruple symmetry (ncard_upperOffLineNontrivialZeros_eq_two_mul, as evenness of the off-line counts), the O(log gamma) multiplicity bound (zeroMultiplicity_le_log_abs_im, multCount_le) and the classical zero-free region. Three results: ZeroCorpus.windowOff_le is the soundness half; corpus_window_ceiling proves that a proportion p on the critical line is derivable from all the facts together if and only if p <= 1 - theta, so at theta = 0.33 the ceiling of the entire corpus is exactly the 67 % already proved and none of the other facts moves it; and rh_not_derivable_from_corpus, offLine_positive_proportion_consistent, density_not_sufficient exhibit modelCorpus theta r, a configuration satisfying every field in which the off-line zeroes are eventually at least a proportion q of a dyadic window for any q < 0.33, and in which for each fixed delta > 0 the count at distance at least delta is bounded in T - so every density statement at a fixed delta, however strong, holds in it. That is the formal content of the observation that the density route cannot converge to RH: the obstruction is the order of the quantifiers, not the size of the exponent. Finally off_le_of_uniformDensity and uniformDensity_not_sufficient delimit what a density bound uniform in delta - stronger than the density hypothesis, and beyond any known method - would contribute: through the field off_attained it gives the power saving N_off(T) = O(T^(1-c)) for the whole off-line count, and constOffCorpus satisfies it with two zeroes off the critical line, so it does not give RH either. No sorry; axioms exactly propext, Classical.choice, Quot.sound; the module imports only mathlib and states nothing about zeta."
