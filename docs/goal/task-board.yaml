  - id: M2-BRUN-TITCHMARSH
    priority: P0
    status: DONE_WEAK
    track: analysis
    title: "Brun-Titchmarsh: the primes in a short interval, from the squarefree large sieve"
    latest_evidence: docs/goal/evidence/2026-09-03-m2-brun-titchmarsh-two-pi.md
    revalidation: docs/goal/evidence/2026-09-03-m2-brun-titchmarsh-two-pi.md
    latest_update: "2026-09-01 DONE_WEAK: RiemannHypothesis/BrunTitchmarsh.lean draws the first sieve consequence of Montgomery's inequality of M2-LARGE-SIEVE-SQUAREFREE. siftSum Q is the sifting sum of the large sieve at the weights w p = p - 1, that is sum_{q <= Q squarefree} prod_{p | q} 1/(p - 1). Since a squarefree q is the product of its prime factors and 1/p <= 1/(p - 1), inv_le_prod_inv_sub_one gives 1/q <= prod_{p | q} 1/(p - 1) and hence sum_inv_squarefree_le_siftSum, sum_{q <= Q squarefree} 1/q <= siftSum Q. The squarefree harmonic sum is bounded below by removing the non-squarefree n from the full harmonic sum: sum_inv_multiples_le reindexes n = d^2 m to give sum_{n <= Q, d^2 | n} 1/n <= (log Q + 1)/d^2, sum_biUnion_le_sum_sum is the union bound over d in [2, Q], and with the telescoping bound sum_inv_sq_le of M2-LARGE-SIEVE-SQUAREFREE this gives sum_inv_not_squarefree_le, the reciprocals of the non-squarefree n <= Q sum to at most (3/4)(log Q + 1); with mathlib's log Q <= harmonic Q <= log Q + 1 this yields quarter_log_le_sum_inv_squarefree and quarter_log_le_siftSum, siftSum Q >= (log Q)/4 - 3/4. card_mul_siftSum_le instantiates Montgomery's inequality at w p = p - 1: a set A included in [0, N) that avoids one residue class modulo every prime p <= Q satisfies |A| siftSum Q <= Q^2 + pi N. Applying this to the primes of an interval - card_primes_Ico_eq shifts [x, x + y) to [0, y), and shifted_primes_avoid shows that a prime x + m > Q avoids the class (p - x mod p) mod p modulo every prime p <= Q - with Q = floor(sqrt y), for which half_log_sub_log_two_le_log_sqrt gives log Q >= (log y)/2 - log 2, produces card_primes_Ico_le: for every x and every y with log y >= 24, the number of primes in [x, x + y) is at most 70 y / log y + sqrt y + 1, whose case x = 0 is card_primes_range_le, the Chebyshev-type upper bound pi(N) <= 70 N / log N + sqrt N + 1. No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used. 2026-09-01 (second pass) the crude squarefree harmonic sum is replaced by a nearly optimal one: sum_inv_le_sum_inv_sq_mul_sum_inv_squarefree writes every n >= 1 as d^2 q with q squarefree (mathlib's Nat.sq_mul_squarefree), which is an injective map n -> (d, q), so sum_{n <= Q} 1/n <= (sum_{d <= Q} 1/d^2)(sum_{q <= Q squarefree} 1/q); with sum_inv_sq_Icc_one_le, sum_{d <= Q} 1/d^2 <= 7/4, this gives four_sevenths_log_le_sum_inv_squarefree and four_sevenths_log_le_siftSum, siftSum Q >= (4/7) log Q, with no additive loss, against (log Q)/4 - 3/4 before (the truth is (6/pi^2) log Q + O(1), and 6/pi^2 = 0.6079 against 4/7 = 0.5714). card_primes_Ico_le_of_const isolates the two numerical constants of the application, and the Brun-Titchmarsh inequality is restated: card_primes_Ico_le now gives at most 23 y / log y + sqrt y + 1 primes in [x, x + y) for every y with log y >= 4 (that is y >= 55), and card_primes_Ico_le_of_log_ge_24 gives 16 y / log y + sqrt y + 1 for log y >= 24; card_primes_range_le is the case x = 0, pi(N) <= 23 N / log N + sqrt N + 1 for log N >= 4. No sorry; axioms exactly propext, Classical.choice, Quot.sound. 2026-09-01 (third pass) the sifting sum itself is bounded below with the classical constant 1: for squarefree d, prod_{p | d} 1/(p - 1) = prod_{p | d} (1/p + 1/p^2 + ...) is the sum of 1/m over the m with radical d, and every n <= Q occurs in exactly one such fibre. sum_inv_primeFactors_eq_le is the finite form, proved by induction on the set P of prime factors: removing a prime p and writing m = p^k m' with k >= 1 is an injective map m -> (k, m'), and sum_geom_Icc_le supplies the factor sum_{k=1}^{Q} p^{-k} <= 1/(p - 1). With squarefree_prod_primeFactors and Icc_subset_biUnion_primeFactors this gives log_le_siftSum, log Q <= siftSum Q. The Brun-Titchmarsh constants improve accordingly: card_primes_Ico_le now gives at most 13 y / log y + sqrt y + 1 primes in [x, x + y) for log y >= 4, card_primes_Ico_le_of_log_ge_24 gives 9 y / log y + sqrt y + 1 for log y >= 24, and card_primes_range_le gives pi(N) <= 13 N / log N + sqrt N + 1 for log N >= 4. No sorry; axioms exactly propext, Classical.choice, Quot.sound.2026-09-01 (fourth pass) the arithmetic-progression form is proved, in the new file RiemannHypothesis/BrunTitchmarshProgressions.lean. siftSumCoprime q Q is the sifting sum of the large sieve at the weights w p = p for p dividing q and w p = p - 1 otherwise, that is sum over the squarefree d <= Q coprime to q of prod_{p | d} 1/(p - 1); card_mul_siftSumCoprime_le instantiates Montgomery's inequality at those weights, the moduli not coprime to q contributing zero because the factor (p - w p)/w p vanishes at a prime p dividing gcd(d, q). The sifting sum is bounded below in two steps: coprime_harmonic_le_siftSumCoprime groups the n <= Q coprime to q into their radical fibres and reuses sum_inv_primeFactors_eq_le, and totient_mul_harmonic_le_coprime_harmonic is the block bound, each block of q consecutive integers containing exactly phi(q) integers coprime to q (mathlib's Nat.filter_coprime_Ico_eq_totient) all at most the right endpoint; together with log J <= sum_{j <= J} 1/j this gives totient_log_div_le_siftSumCoprime, (phi(q)/q) log floor(Q/q) <= siftSumCoprime q Q. The classical constant is then recovered: qPart q n is the q-part of n, the product of p^{v_p(n)} over the primes p dividing q, and coprime_div_qPart shows n / qPart q n is coprime to q, so n -> (n / qPart q n, qPart q n) is an injective splitting with both factors at most n, whence sum_inv_le_coprime_mul_smooth, sum_{n <= Q} 1/n <= (sum_{m <= Q, (m,q)=1} 1/m)(sum_{k <= Q, rad k | q} 1/k); grouping the k by their set of prime factors, which runs over the subsets of the primes dividing q, and reusing sum_inv_primeFactors_eq_le bounds the second factor by prod_{p | q} (1 + 1/(p - 1)) = prod_{p | q} p/(p - 1), which is q/phi(q) by mathlib's Nat.totient_mul_prod_primeFactors (sum_inv_smooth_le and prod_primeFactors_self_div_sub_one). With log Q <= sum_{n <= Q} 1/n this gives totient_log_le_coprime_harmonic and totient_log_le_siftSumCoprime, (phi(q)/q) log Q <= siftSumCoprime q Q. For the application, modOffset and exists_param reparametrize the progression, every prime n in [x, x + y) with n congruent to a modulo q being b + q t with b = x + r, r < q the least shift with x + r congruent to a, and t < Y = floor(y/q) + 1; progression_avoid shows that for every prime p <= Q not dividing q the parameters t with b + q t prime and larger than Q avoid the class t congruent to -b q^{-1} modulo p, computed in ZMod p. With Q = floor(sqrt Y) the sieve gives card_primes_Ico_mod_le: uniformly in x and in a < q, the number of primes of [x, x + y) congruent to a modulo q is at most 4.15 q Y / (phi(q) log Q) + sqrt Y + 1, as soon as Q >= 2. No sorry; axioms exactly propext, Classical.choice, Quot.sound. 2026-09-03 (fifth pass) the rigid sieve level is removed, in the new file RiemannHypothesis/BrunTitchmarshSharp.lean. card_primes_Ico_le_of_level runs the same sieve at an arbitrary level Q >= 2 and gives, uniformly in x, at most (Q^2 + pi y)/log Q + Q + 1 primes in [x, x + y). At the level Q = floor(sqrt y / log y) the term Q^2 <= y/(log y)^2 is negligible against pi y, where the old level floor(sqrt y) made it as large as y, while log Q >= (log y)/2 - log log y - log 2 still has the full main term; the elementary log t <= 2 sqrt t (log_le_two_mul_sqrt) and sqrt y >= (log y)^2/16 (sq_log_le_sixteen_mul_sqrt) make both losses O(sqrt(log log y)) relative. The outcome is card_primes_Ico_le_two_pi: for every eps > 0 there is a Y such that for every y >= Y and every x the interval [x, x + y) contains at most (2 pi + eps) y / log y primes, with 2 pi = 6.283 in place of the earlier 13 and 9; card_primes_Ico_le_two_pi_aux is the same for eps <= 1 with the explicit threshold log y >= (1000/eps)^2 + 10^6, and card_primes_range_le_two_pi is the case x = 0, pi(N) <= (2 pi + eps) N / log N for all large N. The same numeric core, level_bound_le