  - id: M1-ZETA-CHI-AFE
    priority: P1
    status: DONE_WEAK
    track: analysis
    title: "The chi factor of the functional equation, and the approximate functional equation as a recorded statement"
    latest_evidence: docs/goal/evidence/2026-08-27-m1-zeta-chi-afe.md
    revalidation: docs/goal/evidence/2026-08-27-m1-zeta-chi-afe.md
    latest_update: "2026-08-27 DONE_WEAK: three modules supply the arithmetic side of the approximate functional equation. RiemannHypothesis/SqrtHarmonic.lean proves the two elementary sums the later rows need, sum_one_div_sqrt_le (sum_{1 <= n <= N} 1/sqrt n <= 2 sqrt N) and sum_sqrt_le. RiemannHypothesis/ZetaChi.lean defines zetaChi s = 2 (2 pi)^(s-1) Gamma(1-s) sin(pi s/2), proves riemannZeta_eq_zetaChi_mul (zeta s = chi s zeta(1-s) away from the poles), zetaChi_conj (chi of the conjugate is the conjugate of chi), zetaChi_mul_zetaChi_one_sub (chi s chi(1-s) = 1 when sin(pi s) is nonzero) and, from those two, norm_zetaChi_criticalLine: ||chi(1/2 + i t)|| = 1, which is exactly why the two Dirichlet polynomials of the approximate functional equation contribute equally. RiemannHypothesis/ApproximateFunctionalEquation.lean defines zetaSum N s = sum_{1 <= n <= N} n^(-s) and its dual, proves zetaSumDual_criticalLine (on the critical line the dual sum is the conjugate of the direct one) and the uniform trivial bound norm_zetaSum_criticalLine_le (<= 2 sqrt N), sets afeLength t = floor(sqrt(t/2 pi)) with sqrt_afeLength_le, and records the approximate functional equation itself as a Prop, AFECriticalLine C, with the four hypothesis-hygiene questions of AGENTS.md answered in the module docstring. Conditionally on it, norm_riemannZeta_criticalLine_le_of_afe gives the convexity bound ||zeta(1/2 + i t)|| <= (C + 4) t^(1/4) for t >= 2. No sorry; axioms exactly propext, Classical.choice, Quot.sound; the single conditional theorem is recorded in docs/goal/conditional-theorems.txt."
    open_boundary: "The approximate functional equation is not proved, only recorded. Its known proofs go through the Riemann-Siegel contour integral, or through truncated Poisson summation followed by stationary phase (van der Corput's B process), and neither is in mathlib or in this repository; the Euler-Maclaurin representation the repository does have gives zeta as a Dirichlet polynomial of length N only for N much larger than t, because the successive corrections have relative size (t/N)^k, so it cannot halve the length to sqrt t. Consequently the t^(1/4) bound is conditional. Only the trivial bound is used for the two Dirichlet polynomials, so no cancellation is exploited. Nothing about the second moment follows: the sharp asymptotic T log T needs the Montgomery-Vaughan mean value theorem in addition, which is not in the repository, and neither does Ingham's fourth moment or any density estimate."
    milestone: M1
    depends_on:
      - M1-CRITICAL-LINE-MEAN-SQUARE
    rank: 34.86
    open_conjecture_reduction: false
    exit_criteria:
      - "sum_one_div_sqrt_le : sum_{1 <= n <= N} 1/sqrt n <= 2 sqrt N."
      - "riemannZeta_eq_zetaChi_mul : zeta s = chi s zeta (1 - s) away from the poles."
      - "norm_zetaChi_criticalLine : ||chi(1/2 + i t)|| = 1."
      - "zetaSumDual_criticalLine and norm_zetaSum_criticalLine_le : the dual sum is the conjugate of the direct one, and both are at most 2 sqrt N."
      - "AFECriticalLine : the approximate functional equation stated as a Prop, with the four hygiene questions answered."
      - "norm_riemannZeta_criticalLine_le_of_afe : the conditional convexity bound (C + 4) t^(1/4)."
      - "The row is explicit that the approximate functional equation is recorded and not proved."
    required_gates:
      - "lake build RiemannHypothesis.ApproximateFunctionalEquation"
      - "./scripts/audit.sh"

  - id: M1-VDC-THIRD-DERIVATIVE
    priority: P1
    status: DONE_WEAK
    track: analysis
    title: "van der Corput's third derivative test: composing the A process with the second derivative test"
    latest_evidence: docs/goal/evidence/2026-08-27-m1-vdc-third-derivative.md
    revalidation: docs/goal/evidence/2026-08-27-m1-vdc-third-derivative.md
    latest_update: "2026-08-27 DONE_WEAK: RiemannHypothesis/VanDerCorputThird.lean closes the gap that the open boundaries of M1-VDC-SECOND-DERIVATIVE and M1-WEYL-DIFFERENCING both named: the A process and the second derivative test were proved separately and never composed. The A process bounds H ||sum_{n < N} e(f(a+n))||^2 by (N + H)(N + 2 sum_{0 < k < H} ||sum_n e(f(a+n+k) - f(a+n))||), and the differenced phase f(. + k) - f(.) has second derivative between r k and R k when r <= f''' <= R, by the mean value theorem in the two-sided form sub_le_of_deriv_bounds; so the second derivative test applies to each differenced sum, giving norm_sum_e2pi_diff_le, ||sum_{n < L} e(f(n+k) - f(n))|| <= 2(R L k + 2)(2 + 5/sqrt(r k)), the hypothesis r k <= 1 that it needs being exactly H r <= 1. Summing over the shifts with sum_{k < H} k <= H^2/2 and sum_{1 <= k < H} 1/sqrt k <= 2 sqrt H from RiemannHypothesis/SqrtHarmonic.lean (sum_diff_bound_le) yields norm_sq_sum_e2pi_le_of_deriv_three: H ||sum_{n < N} e(f(a+n))||^2 <= (N + H)(N + 8 R N H^2 + 16 H + 20 R N H sqrt H/sqrt r + 80 sqrt H/sqrt r) for 0 < H <= N with H r <= 1. For R comparable to r and H chosen near r^(-1/3) N^(-1/3) this is the classical N r^(1/6) + sqrt N r^(-1/6), the exponent pair (1/6, 2/3). No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used."
    open_boundary: "The number of shifts H is left free, so no clean N r^(1/6) + sqrt N r^(-1/6) is stated; the choice is made only in M1-AFE-SUBCONVEXITY, for the phase of zeta on a dyadic block. No consequence for zeta is drawn in the module itself. The constants 8, 16, 20, 80 are not optimized and the process is not iterated, so nothing beyond the exponent pair (1/6, 2/3) is obtained: the Bombieri-Iwaniec and Huxley exponent 32/205 and the Bourgain exponent 13/84 are out of reach. No B process (Poisson summation with stationary phase) is proved, so the approximate functional equation still cannot be derived."
    milestone: M1
    depends_on:
      - M1-VDC-SECOND-DERIVATIVE
      - M1-WEYL-DIFFERENCING
    rank: 34.855
    open_conjecture_reduction: false
    exit_criteria:
