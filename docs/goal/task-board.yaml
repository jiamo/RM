    latest_update: "2026-09-07 DONE_WEAK: RiemannHypothesis/KoksmaVariation.lean closes the total variation part of the open boundary of M1-KOKSMA. unitVariation f = (eVariationOn f (Set.Icc 0 1)).toReal is the total variation of f on the unit interval; unitVariation_of_monotoneOn identifies it with the rise f 1 - f 0 for a nondecreasing f and abs_sub_le_unitVariation bounds the rise by it. koksma_variation: for every f of bounded variation on [0,1] - no continuity, no chosen decomposition - every sequence x and every N >= 1, |(1/N) sum_{n<N} f(fract x_n) - int_0^1 f| <= (2 V(f) - |f 1 - f 0|) D_N(x), and koksma_variation_le is the readable form with 2 V(f). The proof feeds the two Jordan decompositions f = V_f - (V_f - f) and f = (V_f + f) - V_f, where V_f x = variationOnFromTo f (Set.Icc 0 1) 0 x, into koksma_sub_monotone of M1-KOKSMA; mathlib's variationOnFromTo.monotoneOn, sub_self_monotoneOn and add_self_monotoneOn supply the monotonicity, V_f 0 = 0 and V_f 1 = V(f) the constants, and taking the smaller of the two constants gives the absolute value. unitVariation_le_of_lipschitz bounds the total variation of an L-Lipschitz function by L through LipschitzOnWith.comp_eVariationOn_le and eVariationOn_id_Icc, so koksma_lipschitz_two improves the Lipschitz constant of M1-KOKSMA from 3 L to 2 L. tendsto_average_of_tendsto_discrepancy_variation and tendsto_average_quadratic_variation draw the limiting consequences for every function of bounded variation, the second for alpha n^2 with alpha irrational. No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used; five statements pinned in scripts/revalidation.lean."
    open_boundary: "The constant is 2 V(f) - |f 1 - f 0|, not the sharp V(f) of the classical statement; the sharp constant for a general function of bounded variation is proved by Riemann-Stieltjes integration by parts against d f, and neither the Riemann-Stieltjes integral nor an integration by parts formula for it is available in mathlib or in this repository. The Lipschitz case is settled sharply, with the constant L, by M1-KOKSMA-LIPSCHITZ-SHARP, which bypasses the Jordan decomposition; the same route bounds the in-cell oscillation of a bounded-variation integrand only by the cell variations, whose maximum needs the continuity of the variation function. For a nondecreasing f the constant is exactly V(f), so no sharpness is lost in that case. No functional-variation theory beyond mathlib's eVariationOn is developed, and nothing about zeta is claimed."
