  - id: M1-WEYL-GENERAL
    priority: P1
    status: DONE_WEAK
    track: analysis
    title: "Weyl's inequality in arbitrary degree: the A process iterated d - 1 times"
    latest_evidence: docs/goal/evidence/2026-08-30-m1-weyl-general.md
    revalidation: docs/goal/evidence/2026-08-30-m1-weyl-general.md
    latest_update: "2026-08-30 DONE_WEAK: RiemannHypothesis/WeylGeneral.lean closes the gap that M1-WEYL-QUADRATIC, M1-WEYL-MIN-SUM and M1-WEYL-CUBIC all name as their open boundary, namely that only degrees 2 and 3 are treated and that the general degree-d Weyl inequality, by induction on d, is not formalized. weylMulti beta N H r m is the r-fold shifted majorant sum, W_0 = dioMaj beta N m and W_(r+1)(m) = sum_(k < H) W_r(m k), with the zero shifts included, so that W_r(beta, N, H, 0) = H^r N; weylMulti_mul records that scaling the frequency is the same as scaling the argument, which is what lets each differencing step fold its shift into the outermost variable. IsPolyPhase d alpha f says that f n = sum_(j <= d) c j n^j with c d = alpha, and IsPolyPhase.diff proves that n -> f(n+k) - f n is a polynomial phase of degree d - 1 with leading coefficient d k alpha. The main inequality norm_polyPhaseSum_pow_le is proved by induction on d: for every polynomial phase of degree at most d + 1 with n^(d+1)-coefficient alpha and every H >= 1, ||sum_(0 <= n < N) e(f n)||^(2^d) H^d (N + H) <= 8^(2^d) (N + H)^(2^d) weylMulti ((d+1)! alpha) N H d 1, the induction step being the A process norm_sq_sum_e2pi_le of M1-WEYL-DIFFERENCING, Hoelder over the shifts, and the absorption of the diagonal term N by the k = 0 term of the same majorant sum, which is why the statement carries no additive error. The majorant sum is then evaluated: dioSum beta N M = sum_(0 < t <= M) dioMaj beta N t, weylMulti_le_dioSum folds the r + 1 shifts onto their product, W_(r+1)(m) <= (r+1) H^r N + H^r dioSum(beta, N, m H^(r+1)) for m > 0, and dioSum_le_of_approx is the counting lemma sum_Ioc_le of M1-WEYL-MIN-SUM. Combining them, norm_monomialSum_pow_le_of_approx bounds ||sum_(0 <= n < N) e(alpha n^(r+2))||^(2^(r+1)) H^(r+1) (N + H) for a coprime approximation |(r+2)! alpha - a/q| <= 1/q^2, and norm_monomialSum_pow_mul_le_of_approx puts it in the clean form ||sum_(0 <= n < N) e(alpha n^(r+2))||^(2^(r+1)) H <= 16^(2^(r+1)) N^(2^(r+1)) (r + 11 + 2 log N) whenever H^(r+1) <= q <= N, a saving of N^(-1/((r+1) 2^(r+1))) over the trivial bound for H of size N^(1/(r+1)). No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used."
    open_boundary: "The exponent reached is 1 - 1/((d-1) 2^(d-1)), weaker than the classical Weyl exponent 1 - 1/2^(d-1): the loss is the crude folding of the (d-1)-tuples of shifts onto their product in weylMulti_le_dioSum, where the classical argument uses the divisor bound, which is formalized in M1-WEYL-DIVISOR: folding the tuples onto their product with the weight tau^(d-2) there, and using tau(n) <= C_eps n^eps, reaches the classical exponent 1 - 1/2^(d-1) + eps for the monomial phase. For d = 3 the two agree with the 7/8 of M1-WEYL-CUBIC. The constants are not optimized and the logarithm is not removed. The unconditional badly approximable form and the explicit coefficients, done for d = 2 in M1-WEYL-BADLY-APPROXIMABLE and for d = 3 in M1-WEYL-CUBIC, are not carried out in general degree, and the choice H of size N^(1/(d-1)) is left to the caller rather than made inside the statement. Vinogradov's mean value theorem, which is what degrees beyond the reach of Weyl's method need, is not formalized. As it must be, the bound is conditional on a rational approximation to d! alpha with a large denominator. Nothing about zeta follows: polynomial phases are not zeta phases, and no subconvexity bound, approximate functional equation or density estimate is claimed."
