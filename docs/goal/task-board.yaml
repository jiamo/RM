  - id: M2-LARGE-SIEVE-SIFTED
    priority: P0
    status: DONE_WEAK
    track: analysis
    title: "The large sieve for sifted sets: Montgomery's inequality over prime moduli"
    latest_evidence: docs/goal/evidence/2026-08-30-m2-large-sieve-sifted.md
    revalidation: docs/goal/evidence/2026-08-30-m2-large-sieve-sifted.md
    latest_update: "2026-08-30 DONE_WEAK: RiemannHypothesis/LargeSieveSifted.lean draws from the Farey large sieve of M2-LARGE-SIEVE-FAREY the sieve consequence that its open boundary does not claim, a bound for a set of integers that occupies few residue classes modulo every prime. Taking for the coefficients the indicator of a set A contained in [0, N), the right hand side of large_sieve_farey_pairs is (Q^2 + pi N)|A| and the exponential sum at b/q is indSum A q b = sum_{n in A} e(n b / q). sum_e2pi_mul_div is the orthogonality of the additive characters modulo q, sum_{b < q} e(m b / q) = q if q divides m and 0 otherwise, proved from the geometric sum together with e2pi_div_eq_one_iff, e(m/q) = 1 exactly when q divides m; expanding the square as a double sum over A x A and summing over b, sum_normSq_indSum is Parseval's identity, sum_{b < q} ||indSum A q b||^2 = q sum_{r < q} (fiberCard A q r)^2 where fiberCard counts the elements of A in a class. The term b = 0 is |A|^2 (indSum_zero), and sq_card_le_mul_sum_sq_fiber is Cauchy-Schwarz over the classes actually met: if A meets at most w of them then |A|^2 <= w sum_r (fiberCard)^2. For a prime modulus the reduced fractions are exactly the b/p with 0 < b < p (filter_coprime_prime), so sq_card_mul_le_sum_prime gives the lower bound sum_{0 < b < p} ||indSum A p b||^2 >= |A|^2 (p - w)/w. Summing over the primes p <= Q, which are a subset of the moduli of the Farey sieve, and cancelling one factor |A| gives card_le_sifted, Montgomery's inequality |A| sum_{p <= Q} (p - w p)/(w p) <= Q^2 + pi N. Two consequences are drawn: card_le_sifted_half, if A meets at most half the classes modulo every prime p <= Q then |A| times the number of primes p <= Q is at most Q^2 + pi N; and, as the classical example, card_image_mod_le_of_isSquare, the squares meet at most (p+1)/2 classes modulo an odd prime p because x and p - x have the same square, whence card_le_of_isSquare and card_squares_lt_le, for the set of all squares below N and any Q >= 2, |A| times the number of odd primes p <= Q is at most 3(Q^2 + pi N). No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used."
    open_boundary: "Only prime moduli are used in this row. The full arithmetic large sieve sums over the squarefree q <= Q, where the sifting density is multiplicative by the Chinese remainder theorem; that multiplicative step is carried out separately in M2-LARGE-SIEVE-SQUAREFREE, so within this row the sifting function is a sum over primes rather than over squarefree moduli. The constant Q^2 + pi N carries the factor pi inherited from M2-LARGE-SIEVE-GALLAGHER and is not the sharp Q^2 + N - 1. The character form of the large sieve is still not proved, as M2-LARGE-SIEVE-FAREY already records. For the squares the resulting bound is weaker than the trivial square root of N; that example is there to show the hypothesis is satisfied by a natural set, not to improve on counting squares. Nothing about zeta follows: no mean value theorem is improved, no zero-density estimate is obtained and no zero is located."
