    latest_update: "2026-08-27 DONE_WEAK: RiemannHypothesis/LindelofDensity.lean proves the direction of Backlund's equivalence that runs from the growth hypothesis to the zeroes. LindelofHypothesis is recorded as a Prop (for every eps > 0 there is C > 0 with ||zeta(s)|| <= C (im s)^eps whenever re s >= 1/2 and im s >= 2) and is never proved; every theorem that uses it is flagged in docs/goal/conditional-theorems.txt. The unconditional part of the file is card_filter_le_log_max, the Jensen counting inequality for one disc against the maximum of ||zeta|| on the larger circle: the circle average of log ||zeta|| is at most log M by circleAverage_mono_on_of_le_circle, and ||zeta(3 + i y)|| >= 1/2 supplies the centre. The geometry is that of M2-BOHR-LANDAU: kappa = (sigma - 1/2)/4, r = 3 - sigma + kappa, R = 3 - sigma + 2 kappa, so 3 - R = sigma/2 + 1/4 > 1/2 and the larger disc stays where the Lindelof bound applies, while the smaller one already contains every zero with re >= sigma within kappa of the centre. card_le_sum_card_filter covers a window of unit height by ceil(1/(2 kappa)) such discs, a number depending only on sigma. Together: exists_ncard_zerosRightOfWindow_le gives, for every eps > 0, a constant A with #{zeroes with re >= sigma and T < im <= T + 1} <= A + eps log T for all T >= 5, and tendsto_ncard_zerosRightOfWindow_div_log turns that into the limit statement, the count divided by log T tends to 0. Two further results complete the row: tendsto_ncard_zerosOffCriticalLineWindow_div_log is the two-sided form, obtained by reflecting a zero to the left of the critical line through rho -> 1 - conj rho and paying a factor 2, so that under the hypothesis all but o(log T) of the zeroes of a unit window lie within delta of the critical line for every fixed delta > 0; and exists_ncard_zerosRightOfWindow_le_log is the unconditional comparison, the same window carries at most 41 log T such zeroes, obtained from the local Riemann-von Mangoldt bound of ZeroCountLocal. 