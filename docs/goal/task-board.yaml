  - id: M1-WEYL-DIVISOR
    priority: P1
    status: DONE_WEAK
    track: analysis
    title: "The divisor bound, and Weyl's inequality with the classical exponent"
    latest_evidence: docs/goal/evidence/2026-08-31-m1-weyl-divisor.md
    revalidation: docs/goal/evidence/2026-08-31-m1-weyl-divisor.md
    latest_update: "2026-08-31 DONE_WEAK: RiemannHypothesis/DivisorBound.lean and RiemannHypothesis/WeylDivisor.lean close the open boundary that M1-WEYL-GENERAL names, namely that the (d-1)-fold majorant sum is folded onto the product of the shifts crudely, each of the H^(d-2) remaining tuples being allowed a whole one-dimensional sum, where the classical argument pays only the number of factorizations of the product. exists_card_divisors_le is the divisor bound tau(n) <= C_eps n^eps, proved by multiplicativity from exists_pow_bound (a + 1 <= K (2^eps)^a): the prime powers p^a with p >= 2^(1/eps) contribute at most 1 each, and the finitely many small primes contribute at most K^B with B = ceil(2^(1/eps)); mathlib does not contain this statement. sum_mul_divisor_le says that folding one variable into the product multiplies the weight by one factor of tau, and card_divisors_pow_le bounds tau(v)^r by (C V^eps)^r on [1, V]. weylMulti_le_divisorSum then gives W_(s+1)(beta, N, H, m) <= (s + 1) H^s N + sum_(1 <= u <= H^(s+1)) tau(u)^s dioMaj(beta, N, m u), the first term collecting the tuples with a zero entry; sum_Icc_dioMaj_mul_le compares the majorant along the multiples of m with the one-dimensional dioSum of M1-WEYL-MIN-SUM, sum_divisorWeight_le discharges the divisor weight, and weylMulti_le_of_approx_divisor combines them: the loss over the one-dimensional sum is the divisor factor (C (H^(s+1))^eps)^s and not the factor H^s of weylMulti_le_of_approx. With H = N shifts, norm_monomialSum_pow_mul_le_of_approx_divisor gives, for a coprime approximation |(r+2)! alpha - a/q| <= 1/q^2 with N <= q <= N^(r+1), the bound ||sum_(0 <= n < N) e(alpha n^(r+2))||^(2^(r+1)) N <= 16^(2^(r+1)) N^(2^(r+1)) (C (N^(r+1))^eps)^r (r + 11 + 2(r+1) log N), and exists_norm_monomialSum_pow_mul_le absorbs the divisor loss and the logarithm into N^eps, by taking the divisor exponent eps/(2((r+1)r + 1)) and using log x <= x^delta/delta with delta = eps/2: for every eps > 0 there is a C >= 1 with ||sum||^(2^(r+1)) N <= C N^(2^(r+1)) N^eps, that is ||sum_(n < N) e(alpha n^d)|| <= C' N^(1 - 1/2^(d-1) + eps), Weyl's exponent, for d = r + 2. No sorry; no unproved Prop of the repository is used."
    open_boundary: "The denominator range is N <= q <= N^(r+1), which is what taking H = N shifts allows; the classical statement covers q <= N^d and carries the three terms 1/q + 1/N + q/N^d, which is not proved here. The eps is not removed: the constant is 16^(2^(r+1)) C_0(eps)^r (r + 11 + 4(r+1)/eps) and the sharper (log N)^A form of the divisor loss is not formalized. The constants are not optimized. Vinogradov's mean value theorem, which is what degrees beyond the reach of Weyl's method need, is not formalized. As it must be, the bound is conditional on a rational approximation to d! alpha with a denominator in the stated range; for alpha close to a rational with a small denominator there is no cancellation. Nothing about zeta follows: polynomial phases are not zeta phases, and no subconvexity bound, approximate functional equation or density estimate is claimed."
