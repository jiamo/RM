  - id: M1-AFE-SUBCONVEXITY
    priority: P1
    status: DONE_WEAK
    track: analysis
    title: "The exponent 1/6 for the Dirichlet polynomial of zeta, and for zeta conditionally on the approximate functional equation"
    latest_evidence: docs/goal/evidence/2026-08-27-m1-afe-subconvexity.md
    revalidation: docs/goal/evidence/2026-08-27-m1-afe-subconvexity.md
    latest_update: "2026-08-27 DONE_WEAK: RiemannHypothesis/AFESubconvexity.lean replaces the trivial bound of M1-ZETA-CHI-AFE by a genuine cancellation estimate, and is the first place in the repository where an exponential sum estimate is turned into a bound for a Dirichlet polynomial of zeta. Writing the height as t = u^6 so that every inequality is polynomial in u: norm_sum_e2pi_logPhase_block_le applies the third derivative test of M1-VDC-THIRD-DERIVATIVE to the phase -(u^6/2 pi) log x on a block [M, M + L) with 30 u^2 <= M <= u^3 and L <= M, taking H = ceil(M/u^2), r = c/(4 M^3) and R = 2 c/M^3 with c = u^6/2 pi, and gets ||sum_{j < L} e(-(u^6/2 pi) log(M + j))|| <= 60 sqrt M u; the hypothesis H r <= 1 of the test reduces to 3 R M^3 <= u^6, which holds because pi > 3. The arithmetic of that substitution is isolated in block_bound_numeric, a statement about real numbers only, which checks H X^2 <= 2343 P^2 and hence X <= 60 sqrt P u. cpow_criticalLine_eq splits x^(-1/2-it) into the decreasing weight x^(-1/2) and the pure phase, and Abel summation (norm_sum_weighted_le: nonnegative nonincreasing weights against uniformly bounded prefixes) transfers the block bound at the cost of M^(-1/2), giving norm_sum_block_criticalLine_le, ||sum_{j < L} (M + j)^(-1/2 - i u^6)|| <= 60 u. A strong induction over dyadic blocks - the trivial bound 2 sqrt N below 60 u^2, one admissible block plus the induction hypothesis above it - gives norm_zetaSum_le_of_le_cube: ||sum_{1 <= n <= N} n^(-1/2 - i u^6)|| <= 60 u (log_2 N + 1) for N <= u^3, which is unconditional. Conditionally on AFECriticalLine C, and using ||chi(1/2 + i t)|| = 1 and zetaSumDual_criticalLine to give the dual sum the same bound, norm_riemannZeta_criticalLine_le_of_afe gives ||zeta(1/2 + i t)|| <= C + 120 t^(1/6) (log t + 1) for t >= 10^9, the Hardy-Littlewood subconvexity exponent 1/6. No sorry; axioms exactly propext, Classical.choice, Quot.sound; the single conditional theorem is recorded in docs/goal/conditional-theorems.txt."
    open_boundary: "Since 2026-09-04 the conditionality is gone: M1-SUBCONVEXITY-UNCONDITIONAL proves ||zeta(1/2 + i t)|| <= 200 t^(1/6)(log t + 1) unconditionally, by running the same block estimate over a Euler-Maclaurin polynomial of length t^2 and covering the longer blocks with the second derivative and Kusmin-Landau tests. What is still only recorded within this row is the approximate functional equation itself, so the t^(1/6) bound proved here is conditional; what is unconditional here is the bound for the Dirichlet polynomial sum_{n <= N} n^(-1/2-it) with N <= t^(1/2). The log factor is not removed and the constants 60 and 120 are not optimized, so the bound only becomes numerically better than the trivial 2 sqrt N around t = 10^42, and the threshold t >= 10^9 in the statement is an artefact of the numerical inequalities. Nothing about moments follows: the sharp second moment T log T and Ingham's fourth moment need the Montgomery-Vaughan mean value theorem for Dirichlet polynomials in addition, which is not in the repository, and a pointwise subconvexity bound does not give a sharp mean value. No density estimate follows: the Ingham, Huxley and Guth-Maynard line needs zero-detecting polynomials and large-value estimates, none of which is formalized. Nothing towards 32/205, 13/84 or Lindelof is claimed."
