    latest_update: "2026-08-31 DONE_WEAK: RiemannHypothesis/WeylInterval.lean transports every Weyl bound of the repository from the interval [0, N) to an arbitrary interval [M, M + N), uniformly in M. The mechanism is that translation does not move the leading coefficient of a polynomial phase: WeylGeneral.IsPolyPhase.comp_add proves that if f is a polynomial phase of degree at most d with n^d-coefficient alpha then so is n -> f(n + M), with the same alpha, the new coefficients being c_i = sum_(i <= j <= d) c_j C(j,i) M^(j-i), by the binomial theorem and an exchange of the two sums; sum_e2pi_Ico_shift is the identity sum_(M <= n < M+N) e(f n) = sum_(0 <= n < N) e(f(n+M)) coming from the translation bijection of Finset.Ico. Composing the two with M1-WEYL-CLASSICAL gives norm_polyPhaseSum_Ico_pow_le_three_term (explicit constants, every q > 0), exists_norm_polyPhaseSum_Ico_pow_le_three_term (divisor loss and logarithm absorbed into N^eps) and exists_norm_polyPhaseSum_Ico_le_three_term (||sum_(M <= n < M+N) e(f n)|| <= C N^(1+eps) (1/q + 1/N + q/N^d)^(1/2^(d-1)) with C independent of M); composing with M1-WEYL-BADLY-GENERAL gives exists_norm_polyPhaseSum_Ico_le_of_badlyApproximable, Weyl exponent 1 - 1/2^(d-1) + eps over every interval. The monomial corollaries exists_norm_monomialSum_Ico_le_three_term and exists_norm_monomialSum_Ico_le_of_badlyApproximable, and the explicit coefficient sqrt 2 / d! in exists_norm_monomialSum_Ico_sqrt_two_le, complete the row. No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used."
    open_boundary: "The bounds are those of M1-WEYL-CLASSICAL and M1-WEYL-BADLY-GENERAL transported by translation, so their open boundary is inherited in full: the eps is not removed, the constants are not optimized, the three-term bracket is trivial at the two ends of the denominator range, and no Vinogradov mean value theorem is formalized. The uniformity is in the starting point only: nothing is uniform in the polynomial phase beyond its leading coefficient, and no bound is proved for a sum whose length varies with the starting point or which runs over a set other than an interval. The row adds no new Diophantine input, the hypothesis being on d! alpha, which translation leaves untouched. Nothing about zeta follows: polynomial phases are not zeta phases, and no subconvexity bound, approximate functional equation or density estimate is claimed."
