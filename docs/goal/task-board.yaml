    latest_update: "2026-08-21 DONE_STRONG: RiemannHypothesis/ThetaW.lean and RiemannHypothesis/FourierXi.lean close the gap left open by M2-DE-BRUIJN-NEWMAN. ThetaW defines omega(x) = sum_{n>=1} e^{-pi n^2 x} and W(u) = e^u omega(e^{4u}), proves the theta functional equation in the form W(-u) = W(u) + sinh u, hence W'(0) = -1/2, justifies termwise double differentiation, and proves Phi = (W'' - W)/8 for the de Bruijn-Newman weight Phi. FourierXi folds the Mellin integral of mathlib's modified theta kernel onto (1, infinity), substitutes x = e^{4u}, and obtains Riemann's representation Xi(z) = 1/2 - (4z^2+1) int_0^infty W(u) cos(2uz) du; integrating the exact derivative of W'(u)cos(uz) + z W(u) sin(uz) gives int_0^infty (W'' + z^2 W)(u) cos(uz) du = 1/2, hence H_0(z) = 1/16 - ((z^2+1)/8) int_0^infty W(u) cos(uz) du. Combining: dbnH_zero_eq_riemannXi : H_0(z) = Xi(z/2)/8, and zeta_iff_dbnH_zero : ZetaForm <-> every zero of H_0 is real, with no hypotheses. The earlier conditional Xi.lean theorem zeta_iff_dbnH_zero_of_eq assumed H_0 = Xi, which is false (the correct normalisation halves the variable and divides by 8); it is kept with a docstring recording the correction. RH itself is not proved: zeta_iff_dbnH_zero is an equivalence between two open statements, and no term of type ZetaForm exists. No sorry; axioms exactly propext, Classical.choice, Quot.sound."
