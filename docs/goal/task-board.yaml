  - id: M3-GEOMETRY
    priority: P1
    status: TODO_NEEDS_DESIGN
    track: research
    title: "Categorification: the zeroes of zeta as Frobenius eigenvalues on a conjectural arithmetic cohomology of Spec Z"
    latest_evidence: docs/geometry-rh.md
    latest_update: "2026-08-20 scoped from the geometry survey. The precedent is strict: over a finite field the zeroes of zeta_C(s) are the eigenvalues of Frobenius on etale H^1, and RH-analogues were proved geometrically (Weil, Deligne, Katz-Sarnak). For Spec Z the required cohomology theory does not exist; the task is to state the categorification conjecture precisely and to formalize its strict components (the explicit formula as a trace formula)."
    open_boundary: "The conjectural object is a cohomology H of Spec Z with an operator F whose eigenvalues are the zeroes (pure weight 1/2 would be RH). No such theory is known (the etale cohomology of Spec Z is degenerate; the archimedean place has no function-field analogue). Formalizable now: Weil's explicit formula in trace-formula form, the Hadamard-product/determinant reading of zeta, and the function-field model (as a statement about zeta of curves over finite fields). The categorification conjecture itself can only be stated, not proved."
    milestone: M3
    depends_on:
      - M1-SPECTRAL-INTERPRETATION
      - M1-EXPLICIT
    rank: 53
    exit_criteria:
      - "The categorification conjecture is stated as a Prop: the zeroes of zeta are the eigenvalues of an operator F on a cohomology H of Spec Z with pure weights."
      - "The strict components are formalized: the explicit formula in trace-formula form, and the determinant (Hadamard) reading of zeta."
      - "The function-field analogue is stated precisely (zeta of a curve over F_q: zeroes are Frobenius eigenvalues) as the proved model."
      - "The row does not claim RH: it documents what is provable (the model and the trace-formula identity) and what is conjectural (the existence of H)."
    required_gates:
