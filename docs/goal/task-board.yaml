    latest_update: "2026-08-30 DONE_WEAK: RiemannHypothesis/WeylCubic.lean closes, for degree 3, the gap that M1-WEYL-QUADRATIC and M1-WEYL-MIN-SUM name as their open boundary, namely that only the quadratic phase is treated and that the general degree-d Weyl inequality, which iterates the A process, is not formalized. With cubeSum alpha N = sum_{0 <= n < N} e(alpha n^3), the file applies van der Corput's A process twice. dioMaj beta N m is the majorant min(N, 1/(2 intDist (beta m))), written with an explicit case so that no convention for 1/0 is needed, and norm_linSum_le_dioMaj bounds by it any linear exponential sum of length at most N and frequency beta m. mul_normSq_cubeSum_le is the first differencing, H ||S||^2 <= (N + H - 1)(N + 2 sum_{0 < k < H} cubeInner alpha N k), where cubeInner is the once differenced sum, whose phase is quadratic; cubic_second_diff computes the twice differenced phase, f(n+l+k) - f(n+l) - f(n+k) + f n = (6 alpha k l) n + alpha(3 k l^2 + 3 k^2 l), linear in n with leading coefficient 6 alpha k l, and mul_sq_cubeInner_le is the second differencing, H (cubeInner alpha N k)^2 <= (N + H - 1)(N + 2 sum_{0 < l < H} dioMaj (6 alpha) N (k l)). Cauchy-Schwarz over the H - 1 shifts turns the square of the sum over k into H times the sum of squares, and sum_double_le folds the pairs (k, l) onto the single variable m = k l: for a fixed k the map l -> k l is injective into (0, H^2], so the double sum is at most H times sum_{0 < m <= H^2} dioMaj (6 alpha) N m, which is exactly the counting lemma sum_Ioc_le of M1-WEYL-MIN-SUM; no divisor bound is needed. norm_cubeSum_pow_four_le_of_approx assembles this with H free, and the choice H = sqrt N + 1 gives the main result norm_cubeSum_pow_eight_le_of_approx: if a, q are coprime, q <= 4N and |6 alpha - a/q| <= 1/q^2, then ||cubeSum alpha N||^8 <= 2^22 (4N/q + 1)^2 N^7 (1 + log 4N)^2, that is ||S|| << N^(7/8) (log N)^(1/4) for q of order N. As in M1-WEYL-BADLY-APPROXIMABLE, Dirichlet's theorem plus le_den_of_badlyApproximable removes the hypothesis on the denominator for a badly approximable coefficient: norm_cubeSum_pow_eight_le_of_badlyApproximable gives ||cubeSum alpha N||^8 <= 2^22 (4/c + 1)^2 N^7 (1 + log 4N)^2 for every N >= 1 whenever 6 alpha is badly approximable with constant c, and badlyApproximable_sqrt_two makes this explicit in norm_cubeSum_sqrt_two_le: ||sum_{0 <= n < N} e((sqrt 2 / 6) n^3)||^8 <= 2^31 N^7 (1 + log 4N)^2. No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used."
