    latest_update: "2026-09-01 DONE_WEAK: RiemannHypothesis/LargeSieveSquarefree.lean closes the multiplicativity gap recorded in the open boundary of M2-LARGE-SIEVE-SIFTED. With expSum A x the exponential sum of the indicator of A and redSq A q the mean square over the reduced fractions with denominator q, sum_normSq_dft is Parseval's identity for the discrete Fourier transform of an arbitrary complex-valued function on the residues mod q; expSum_add_div_eq writes the exponential sum at c/p + x as that transform, at c, of the fibre sums of A over the residue classes mod p, and sq_norm_expSum_mul_le_sum_prime is the prime step at an arbitrary shift x, ||S(x)||^2 (p - w)/w <= sum_{0 < c < p} ||S(c/p + x)||^2. For p prime not dividing m the numbers (c m + d p) mod p m with 0 < c < p and d reduced mod m are distinct reduced residues mod p m, and their fractions are c/p + d/m, so summing the prime step over d gives redSq_prime_mul_le, ((p - w)/w) F(m) <= F(p m); strong induction on a squarefree q, split as minFac times the rest, gives sq_card_mul_prod_le_redSq, F(q) >= |A|^2 prod_{p | q} (p - w p)/(w p). Restricting the Farey large sieve of M2-LARGE-SIEVE-FAREY to the squarefree moduli and cancelling one factor |A| gives card_le_sifted_squarefree, Montgomery's inequality |A| sum_{q <= Q squarefree} prod_{p | q} (p - w p)/(w p) <= Q^2 + pi N, and with the weights max(1, #(A mod p)), for which every factor is at least 1, card_le_sifted_squarefree_half, |A| times the number of squarefree q <= Q is at most Q^2 + pi N for a set meeting at most half the classes modulo every prime p <= Q. The squarefree moduli are then counted: card_filter_sq_dvd_le bounds the multiples of d^2 in [1, Q] by Q/d^2, sum_inv_sq_le is the telescoping bound sum_{2 <= d <= n} 1/d^2 <= 3/4 - 1/n, and together they give card_squarefreeUpTo_ge, at least Q/4 of the moduli up to Q are squarefree. Inserting that linear count gives card_le_of_sifted_half_sqrt: a set below N meeting at most half the residue classes modulo every prime p <= sqrt N has at most 34 sqrt N elements, which is the consequence prime moduli alone do not give, the sum over primes yielding only N / log N. No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used."
    open_boundary: "Only squarefree moduli are treated: the sifting density at a prime power is not proved, because the large sieve is applied at reduced fractions and the inductive step uses that p does not divide m. The constant Q^2 + pi N carries the factor pi inherited from M2-LARGE-SIEVE-GALLAGHER and is not the sharp Q^2 + N - 1. No Selberg-type optimization of the sifting weights is carried out, the character form of the large sieve is still not proved, and no Bombieri-Vinogradov consequence is drawn; the Brun-Titchmarsh consequence is drawn separately, in M2-BRUN-TITCHMARSH, and is not part of this row. Nothing about zeta follows: no mean value theorem is improved, no zero-density estimate is obtained and no zero is located."
