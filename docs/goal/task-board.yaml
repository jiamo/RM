    revalidation: docs/goal/evidence/2026-08-25-m2-bohr-landau.md
    latest_update: "2026-08-25 DONE_STRONG: RiemannHypothesis/BohrLandau.lean draws the first consequence for the zeroes from the mean square. exists_ncard_zerosRightOf_le : for every fixed sigma with 1/2 < sigma < 1 there is C > 0 with #{rho : zeta rho = 0, re rho >= sigma, 0 < im rho <= T} <= C T for every T >= 1; exists_ncard_zerosOffCriticalLine_le is the two-sided form, obtained by reflecting in the critical line through rho |-> 1 - conj rho; exists_mul_le_windowCount_zero is the Riemann-von Mangoldt lower bound N(0, T) >> T log T, read off the dyadic window (T/2, T] of the vendored Zeta23 formula; and tendsto_zerosOffCriticalLine_div_windowCount concludes that the proportion of zeroes of ordinate in (0, T] at distance at least delta from the critical line tends to 0, at the rate O_delta(1 / log T). The route is Jensen, not the argument principle. Fix kappa = (sigma - 1/2)/4, r = 3 - sigma + kappa, R = 3 - sigma + 2 kappa, so 0 < r < R < 5/2 and 3 - R > 1/2. A zero with re rho >= sigma and |im rho - y| <= kappa lies in the closed disc of radius r about 3 + i y, so the Jensen counting inequality of M2-ZERO-COUNT-LOCAL bounds the number of such zeroes by (circleAverage (log ||zeta||) (3 + i y) R + log 2) / log (R / r), using ||zeta(3 + i y)|| >= 1/2. Since log x <= x^2 / 2, the circle average of log ||zeta|| is at most the circle average of ||zeta||^2 / 2, and RiemannHypothesis/ZetaCircleAverage.lean integrates the latter in y by Tonelli and Fubini over [0, 2 pi] x [a, b], reducing it to the mean square of M1-STRIP-MEAN-SQUARE uniformly in the abscissa - which is why the uniform form was needed, the circle meeting the abscissas 3 - R to 3 + R at once. Integrating a window indicator in y then converts the local count into the global one. Nothing is conditional; no sorry; axioms exactly propext, Classical.choice, Quot.sound. Scope, all of it inside what the exit criteria claim: zeroes are counted without multiplicity in the numerators, while the Riemann-von Mangoldt count in the denominator is with multiplicity, so the ratio statement is if anything conservative; the constants are not explicit and blow up as sigma decreases to 1/2, as they must; the bound is O(T) and not the o(T) of Carlson, so the Prop AlmostAllZerosNearCriticalLine, which normalizes by T rather than by N(0, T), is left open on M1-ALMOST-ALL-STRIP and would need a mollified mean square; no zero-free region and no location of any individual zero is claimed, and RH is neither proved nor disproved."
