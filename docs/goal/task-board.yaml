  - id: M1-MEAN-SQUARE
    priority: P1
    status: DONE_STRONG
    track: classical
    title: "The mean value theorem for Dirichlet series, for zeta and for 1/zeta, on a line of absolute convergence"
    latest_evidence: docs/goal/evidence/2026-08-22-m1-mean-square.md
    revalidation: docs/goal/evidence/2026-08-22-m1-mean-square.md
    latest_update: "2026-08-22 DONE_STRONG: RiemannHypothesis/MeanSquare.lean proves, for sigma > 1, that (1/T) int_0^T |zeta(sigma + i t)|^2 dt tends to zeta(2 sigma) (meanSquareAvg_tendsto_riemannZeta, and in series form meanSquareAvg_tendsto_tsum). The route is the absolutely convergent double Dirichlet series for |zeta|^2 (normSq_riemannZeta_line_eq_tsum), its termwise integration over [0, T] (integral_normSq_riemannZeta_line), the oscillation bound ||int_0^T e^(i theta t) dt|| <= 2/|theta| for theta nonzero (oscAvg_tendsto_zero), and Tannery's theorem for the limit. The computation is carried out for a general Dirichlet series (meanSquareAvg_tendsto_tsum_of_summable: if sum of ||a_n|| (n+1)^(-sigma) converges then the mean square of the series tends to sum of (||a_n|| (n+1)^(-sigma))^2); zeta is the case a_n = 1, and the Moebius series gives the mean square of 1/zeta (meanSquareAvg_tendsto_tsum_moebius: the limit is sum of mu(n)^2 n^(-2 sigma)). No sorry; axioms exactly propext, Classical.choice, Quot.sound. Scope: only the half-plane of absolute convergence is covered; the second moment inside the critical strip, in particular the Hardy-Littlewood asymptotic int_0^T |zeta(1/2 + i t)|^2 dt ~ T log T, is a separate problem needing the approximate functional equation and is not claimed here."
