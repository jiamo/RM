    latest_update: "2026-09-04 DONE_WEAK: RiemannHypothesis/WeylDiscrepancy.lean closes the gap that M1-WEYL-COUNT, M1-WEYL-COUNT-GENERAL, M1-WEYL-CRITERION and M1-WEYL-PORTMANTEAU all recorded in their open boundaries, that no rate of convergence was claimed. The kernel kern M t = |sum_{j<M} e(t j)|^2 / M is nonnegative, has mass one over a period (integral_kern, from the diagonal of its double sum kern_eq_sum) and satisfies kern M t <= 1/(4 M t^2) for 0 < |t| <= 1/2 (kern_le_inv, from the geometric-series bound of M1-WEYL-QUADRATIC), so its mass outside [-delta, delta] is at most 1/(2 M delta) (integral_kern_tail). Two estimates follow: abs_sub_smoothing_le, that a 1-periodic L-Lipschitz g with values in [0,1] differs from its convolution with the kernel by at most L delta + 1/(2 M delta); and abs_avg_smoothing_sub_integral_le, that the smoothed empirical density deviates from 1 by at most 2 sum_{m=1}^{M-1} ||sum_{n<N} e(m x n)||/N (abs_avgKern_sub_one_le, folding the pairs (j,k) onto their difference in sum_norm_expSum_shift_le). Adding them gives abs_avg_sub_integral_le, the quantitative Weyl criterion, and squeezing the indicator of [a,b) between two periodized trapezoids of slope 1/eta gives abs_countIn_div_sub_le; with eta = 1/K, delta = 1/K^2 and M = K^4 all the parameters collapse to abs_countIn_div_sub_le_pow, a bound 4/K + 2 sum_{m<K^4} ||S_m||/N. For a badly approximable alpha, meaning ||m alpha|| >= c/m for all m >= 1, norm_expSum_linear_le bounds the sums of alpha n by m/(2c) and abs_countIn_div_sub_le_linear turns this into an explicit rate: the discrepancy of alpha n on an interval is at most (4 + 1/c)/K whenever K^9 <= N, that is O(N^(-1/9)). No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used; three statements pinned in scripts/revalidation.lean."
