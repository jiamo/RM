  - id: M1-WEYL-MIN-SUM
    priority: P1
    status: DONE_WEAK
    track: analysis
    title: "The counting lemma of Weyl's method, and the exponent 1/2 for the quadratic exponential sum"
    latest_evidence: docs/goal/evidence/2026-08-29-m1-weyl-min-sum.md
    revalidation: docs/goal/evidence/2026-08-29-m1-weyl-min-sum.md
    latest_update: "2026-08-29 DONE_WEAK: RiemannHypothesis/WeylMinSum.lean formalizes the counting lemma that M1-WEYL-QUADRATIC and M1-WEYL-QUADRATIC-QUANTITATIVE both named as the missing ingredient, and draws the exponent it gives. It is stated for an arbitrary majorant, so that no convention for 1/0 is needed: if g : Z -> R satisfies 0 <= g k <= N and g k * 2 intDist (beta k) <= 1 for all k, and a, q are coprime with |beta - a/q| <= 1/q^2, then sum_block_le bounds the mass of g over any q consecutive integers by 4N + q(1 + log q), and sum_Ioc_le iterates this over floor(H/q) + 1 blocks to give sum_{0 < k <= H} g k <= (H/q + 1)(4N + q(1 + log q)). The proof is the classical grid argument: writing beta = a/q + theta with |theta| <= 1/q^2, on a block k = x + r, 1 <= r <= q, the perturbation theta r is at most one grid step 1/q, and since a is invertible modulo q the points beta x + a r / q run exactly once through the q points (i + f)/q of a progression of step 1/q (gridIndex, grid_sub_le_intDist, gridIndex_injOn), so all but the four points nearest the integers give a harmonic sum, at most q(1 + log q) by mathlib's harmonic_le_one_add_log, while the four exceptional ones are bounded by N. Feeding the lemma into the differencing inequality norm_sq_sum_e2pi_le of M1-WEYL-DIFFERENCING with H = N rather than H = q/2 - the inner sums quadInner alpha N k are bounded both by N and by 1/(2 intDist (2 alpha k)) - gives normSq_quadSum_le_of_approx_count: ||sum_{0 <= n < N} e(alpha n^2)||^2 <= 2N + 4(N/q + 1)(4N + q(1 + log q)) whenever a, q are coprime and |2 alpha - a/q| <= 1/q^2. For a denominator N <= q <= 2N this is normSq_quadSum_le_of_approx_large, ||sum||^2 <= 66 N (1 + log 2N), and norm_quadSum_le_of_approx_large, ||sum|| <= 9 sqrt(N (1 + log 2N)): square-root cancellation, the exponent 1/2 up to a logarithm in place of the 3/4 of M1-WEYL-QUADRATIC-QUANTITATIVE. No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used."
    open_boundary: "The logarithm is not removed: the bound is sqrt(N log N), not N^(1/2 + eps) in the usual uniform sense, and the constants 4, 66, 9 are not optimized. As it must be, the bound is conditional on the existence of a rational approximation with a large denominator, N <= q <= 2N; for alpha close to a rational with small denominator there is no cancellation at all. Dirichlet's theorem does not produce a denominator in a prescribed range, so this row draws nothing unconditional about a fixed irrational alpha; that is done, for the badly approximable coefficients, in M1-WEYL-BADLY-APPROXIMABLE. Only the quadratic phase here: the degree-3 case, which iterates the differencing twice and feeds the same counting lemma, is proved in M1-WEYL-CUBIC, and the general degree-d case, with the weaker exponent 1 - 1/((d-1) 2^(d-1)), in M1-WEYL-GENERAL. Nothing about zeta follows: quadratic phases are not zeta phases, and no subconvexity bound, approximate functional equation or density estimate is claimed."
