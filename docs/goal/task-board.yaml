  - id: M1-STRIP-MEAN-SQUARE
    priority: P1
    status: DONE_WEAK
    track: classical
    title: "The mean square of zeta on a vertical line inside the critical strip"
    latest_evidence: docs/goal/evidence/2026-08-24-m1-strip-mean-square-bohr-landau.md
    revalidation: docs/goal/evidence/2026-08-24-m1-strip-mean-square-bohr-landau.md
    latest_update: "2026-08-25 amended: RiemannHypothesis/StripMeanSquareUniform.lean makes the constant uniform in the abscissa. exists_integral_normSq_riemannZeta_le_uniform : for 1/2 < sigma0 < 1 there is a single C > 0 with int_1^T ||zeta(sigma + i t)||^2 dt <= C T for every sigma >= sigma0 and every T >= 1, with no upper bound on sigma, and integral_normSq_riemannZeta_le_uniform_Icc gives the same on a general interval [a, b] inside [1, infinity). The uniformity is what a Jensen or circle-average argument needs, since the circle of integration meets a whole range of abscissas at once; it is obtained by running the Euler-Maclaurin balance of the previous entry with the order m fixed once and for all by sigma0, using that the off-diagonal sum is antitone in sigma (offDiagSum_antitone) and that ||zeta|| <= 2 for re s >= 2. No sorry; axioms exactly propext, Classical.choice, Quot.sound. 2026-08-24 DONE_STRONG (Bohr-Landau, every sigma > 1/2): RiemannHypothesis/StripMeanSquareBohrLandau.lean closes the family 2/3 -> 3/5 -> 4/7 -> ... -> 1/2. exists_integral_normSq_riemannZeta_le_half : for fixed sigma with 1/2 < sigma < 1 there is C > 0 with int_0^T ||zeta(sigma + i t)||^2 dt <= C T for every T >= 1, together with the first moment (exists_integral_norm_riemannZeta_le_half) and the large values estimate (exists_volume_norm_riemannZeta_ge_le_half) in the same range. The new content is the Euler-Maclaurin expansion of arbitrary order m, obtained by iterating one integration by parts instead of writing out a fixed number of Bernoulli corrections: bq m u = bernoulliFun m u / m! are the scaled Bernoulli polynomials with (bq (m+1))' = bq m, poch m s = prod_{i<m} (s+i) and dfun m s x = (-1)^m poch m s x^(-s-m) is the m-th derivative of x^(-s), emTerm m a s = int_a^{a+1} bq m (x-a) dfun m s x dx is the remainder of order m on one unit interval, emTerm_add_emTerm_succ is the integration by parts step, and emTail_succ is the resulting telescoped recursion emTail m N s = -(bq (m+1) 0) dfun m s (N+1) - emTail (m+1) N s. Iterating it by Nat.le_induction (exists_norm_emTail_one_le) gives exists_norm_riemannZeta_sub_dirichletPoly_le_em : ||zeta(s) - sum_{n <= N} n^(-s)|| <= (N+1)^(1-sigma)/||s-1|| + C (N^(-sigma) + (sigma+|t|+m)^m N^(1-sigma-m)) for 1 <= N and sigma + |t| <= N, so an arbitrary power of N is gained. The balance: m = ceil((1-sigma)/(2 sigma - 1)) + 1, e = m/(sigma+m-1), N = ceil(T^e) + ceil(T) + 1; then e(2-2sigma) < 1 (this is exactly sigma > (m+1)/(2m+1)) and the identity e(2 sigma + 2m - 2) = 2m makes the error term O(T). No sorry; axioms exactly propext, Classical.choice, Quot.sound. The sigma > 2/3, sigma > 3/5 and sigma > 4/7 statements are unchanged and still pinned. Scope: an upper bound of the correct order, not an asymptotic; nothing on the critical line sigma = 1/2, where the mean square is ~ T log T; no consequence for the zeroes is drawn. Previous entry: 2026-08-24 DONE_WEAK (second Bernoulli correction): RiemannHypothesis/StripMeanSquareBernoulli.lean extends the mean square bound from sigma > 3/5 to sigma > 4/7. exists_integral_normSq_riemannZeta_le_four_sevenths : for fixed sigma with 4/7 < sigma < 1 there is C > 0 with int_0^T ||zeta(sigma + i t)||^2 dt <= C T for every T >= 1, together with the first moment (exists_integral_norm_riemannZeta_le_four_sevenths) and the large values estimate (exists_volume_norm_riemannZeta_ge_le_four_sevenths) in the same range. The gain is the second order (Bernoulli B_3) Euler-Maclaurin correction: bern3Green a z = B_3(z - a)/6 is the Green function of the corrected quadrature rule, bernPrimitive and hasDerivAt_bernPrimitive give the fundamental theorem of calculus identity integral_bernIntegrand, bernTerm n s is the trapezoidal error with the explicit B_2 = 1/6 term removed, bernTerm_eq_integral writes it as an integral against bern3Green, and norm_bernTerm_le gives ||bernTerm n s|| <= ||s|| ||s+1|| ||s+2|| (n+1)^(-(3 + re s))/48. Hence riemannZeta_eq_bernApprox and norm_riemannZeta_sub_dirichletPoly_le_bern have tail O(||s||^3 N^(-2-sigma)), the Dirichlet polynomial may be taken of length N = ceil(T^(3/(2+sigma))), and the balance condition (2-2sigma) 3/(2+sigma) < 1 reads sigma > 4/7. No sorry; axioms exactly propext, Classical.choice, Quot.sound. The sigma > 2/3 and sigma > 3/5 statements are unchanged and still pinned. Scope: an upper bound of the correct order, not an asymptotic; nothing on the critical line; no consequence for the zeroes is drawn. Previous entry: 2026-08-24 DONE_WEAK (refined): RiemannHypothesis/StripMeanSquareTrapezoid.lean extends the mean square bound from sigma > 2/3 to sigma > 3/5. exists_integral_normSq_riemannZeta_le_three_fifths : for fixed sigma with 3/5 < sigma < 1 there is C > 0 with int_0^T ||zeta(sigma + i t)||^2 dt <= C T for every T >= 1, together with the first moment (exists_integral_norm_riemannZeta_le_three_fifths) and the large values estimate (exists_volume_norm_riemannZeta_ge_le_three_fifths) in the same range. The gain is the first order (trapezoidal) Euler-Maclaurin correction: trapTerm n s is the trapezoid rule error for x^(-s) on [n+1, n+2], trapTerm_eq_integral writes it as -int P(x) s (s+1) x^(-s-2) dx against the Green's function P(x) = ((x-a)^2 - (x-a))/2 of the trapezoid rule, and norm_trapTerm_le gives ||trapTerm n s|| <= (1/8) ||s|| ||s+1|| (n+1)^(-(2 + re s)). The tail of the expansion is therefore O(||s||^2 N^(-1-sigma)) instead of O(||s|| N^(-sigma)), the Dirichlet polynomial may be taken of length N = ceil(T^(2/(1+sigma))), and the balance condition (2-2sigma) 2/(1+sigma) < 1 reads sigma > 3/5. No sorry; axioms exactly propext, Classical.choice, Quot.sound. The earlier sigma > 2/3 statements of RiemannHypothesis/StripMeanSquare.lean are unchanged and still pinned. Scope: an upper bound of the correct order, not an asymptotic; nothing on the critical line; no consequence for the zeroes is drawn. Previous entry: 2026-08-24 DONE_WEAK: RiemannHypothesis/StripMeanSquare.lean proves exists_integral_normSq_riemannZeta_le : for fixed sigma with 2/3 < sigma < 1 there is C > 0 with int_0^T ||zeta(sigma + i t)||^2 dt <= C T for every T >= 1. This is the first mean-square bound of the repository inside the critical strip; M1-MEAN-SQUARE covers only sigma > 1, where the Dirichlet series converges absolutely. The route: the truncated zeta sum sum_{n <= N} n^(-s) is compared with zeta by the Euler-Maclaurin representation of M1-ZETA-CONTINUATION (norm_riemannZeta_sub_dirichletPoly_le), its mean square is bounded by the mean value theorem for Dirichlet polynomials (integral_normSq_dirichletPoly_one_le), whose off-diagonal term is estimated by offDiagSum_one_le as O(N^(2-2sigma) (1 + log N)) via the elementary sums sum_Icc_rpow_neg_le and sum_rpow_neg_div_abs_sub_le, the pole term is integrated by integral_inv_sq_shift_le (int_0^T dt/((1-sigma)^2 + t^2) <= (pi/2)/(1-sigma)^2), and N = ceil(T^(1/sigma)) balances the two errors. No sorry; axioms exactly propext, Classical.choice, Quot.sound. Two consequences are recorded in the same file: the first moment int_0^T ||zeta(sigma + i t)|| dt = O(T) (exists_integral_norm_riemannZeta_le), and the large values estimate that the set of t in (0, T] with ||zeta(sigma + i t)|| >= V has measure at most C T / V^2 (exists_volume_norm_riemannZeta_ge_le), which is the shape in which a mean square enters the zero-density estimates. Scope: an upper bound of the correct order, not an asymptotic; nothing on the critical line; no consequence for the zeroes is drawn."
    open_boundary: "What remains open is not the range of sigma but the strength of the statement. (i) The rows of this file state an upper bound of the correct order of magnitude; the asymptotic int_0^T ||zeta||^2 ~ zeta(2 sigma) T is now proved in the same range sigma > 1/2 by M1-STRIP-MEAN-SQUARE-ASYMPTOTIC, but no second order term is extracted. (ii) Nothing is claimed on the critical line sigma = 1/2, where the Hardy-Littlewood asymptotic int_0^T ||zeta(1/2 + i t)||^2 ~ T log T needs the approximate functional equation; the constant produced here blows up as sigma decreases to 1/2, as it must. (iii) Higher moments (the fourth moment of Ingham) are not addressed. (iv) No consequence for the zeroes is drawn: the density theorem M1-ALMOST-ALL-STRIP needs the mean square of zeta against a mollifier, not of zeta alone."
