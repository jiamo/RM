    latest_update: "2026-08-26 DONE_WEAK: RiemannHypothesis/WeylDifferencing.lean supplies the A process that the open boundaries of M1-VAN-DER-CORPUT and M1-KUSMIN-LANDAU both named as missing, and that mathlib does not have. For a sequence z vanishing outside [0, N), with corr z N k the correlation at shift k, mul_normSq_sum_le proves H ||sum z||^2 <= (N + H - 1) sum_{|k| < H} ||corr k|| for every H >= 1, and mul_normSq_sum_le_weighted the sharper classical form with the Fejer weights H - |k|, the two differing only in how the H^2 pairs are counted (at most H, respectively exactly H - |k|, pairs give the shift k). The proof is elementary: the block sums B n = sum_{h < H} z (n + h) over the window [1 - H, N) average to H times the whole sum, Cauchy-Schwarz costs the cardinality N + H - 1 of that window, and expanding the square turns sum ||B n||^2 into sum_{h1, h2 < H} corr (h1 - h2). The arithmetic form norm_sq_sum_e2pi_le then reads, for an arbitrary phase f, H ||sum_{n < N} e(f n)||^2 <= (N + H - 1)(N + 2 sum_{0 < k < H} ||sum_{n < N - k} e(f(n+k) - f(n))||): the sum is controlled by its differenced sums, whose phases move k times as fast. No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used."
