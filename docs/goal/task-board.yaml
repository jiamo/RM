    latest_update: "2026-08-28 DONE_WEAK: RiemannHypothesis/LargeSieve.lean proves the large sieve inequality, the gate of the zero-density line. large_sieve : for points t i pairwise delta-separated modulo one, sum_i ||sum_{n < N} a n e(n t i)||^2 <= (N + delta^(-1)(1 + log (2 delta)^(-1))) sum_n ||a n||^2, and card_le_of_large_values is the counting form. intDist theta = |theta - round theta| is the distance to the nearest integer. The proof is the Halasz-Montgomery / Schur bound sum_normSq_le_of_rowSum_le of RiemannHypothesis/HalaszMontgomery.lean applied to the vectors n -> e(-n t i), whose Gram matrix is the Dirichlet kernel kernel N theta = sum_{n < N} e(n theta); the row-sum bound sum_norm_kernel_row_le combines norm_kernel_le_card on the diagonal with norm_kernel_le_inv_intDist (||kernel N theta|| <= 1/(2 ||theta||), from the geometric sum and Jordan's inequality two_mul_intDist_le_abs_sin) off it, and an injection of the separated points into Bool x Icc 1 K with K = floor((2 delta)^(-1)) turns the off-diagonal row sum into delta^(-1) sum_{k <= K} 1/k, bounded by the repository's sum_inv_Icc_le.  The same file also proves a ceiling, in the style of M2-METHOD-CEILING: intDist_eq_abs_of_abs_le_half, AdmissibleConstant, length_le_of_admissibleConstant (a single point with all coefficients 1 forces C >= N), separation_le_of_admissibleConstant (the floor((2 delta)^(-1)) + 1 points 0, delta, 2 delta, ... with a single coefficient force C >= floor((2 delta)^(-1)) + 1) and le_of_admissibleConstant (max N (2 delta)^(-1) <= C), so both terms of the constant are necessary and only the logarithmic factor is open. No sorry; axioms exactly propext, Classical.choice, Quot.sound."
