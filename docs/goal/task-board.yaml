  - id: M1-KUSMIN-LANDAU
    priority: P1
    status: DONE_WEAK
    track: analysis
    title: "The Kusmin-Landau inequality: the first derivative test for exponential sums"
    latest_evidence: docs/goal/evidence/2026-09-03-m1-kusmin-landau-general.md
    revalidation: docs/goal/evidence/2026-09-03-m1-kusmin-landau-general.md
    latest_update: "2026-08-26 DONE_WEAK: RiemannHypothesis/KusminLandau.lean is the sum side of M1-VAN-DER-CORPUT, and like it is absent from mathlib. With e(x) = exp(2 pi i x), norm_sum_e2pi_le proves the purely discrete core: if the consecutive differences d i = u(i+1) - u(i) of a real sequence are monotone in either direction and lie in [lam, 1 - lam] with lam > 0, then ||sum_{j <= K} e(u j)|| <= 1 + 2/lam, with no dependence on K. The proof is summation by parts against the amplitude g i = 1/(e(d i) - 1); the identity 1/(e(x) - 1) = -1/2 - (i/2) cot(pi x) shows the real part of g is constant, so the differences of g are half the differences of cot(pi d), and since cot(pi .) is antitone on (0,1) and d is monotone that sum telescopes; Jordan's inequality sin(pi x) >= 2 lam on [lam, 1 - lam] bounds both the amplitude and the telescoped total. norm_sum_e2pi_le_of_deriv is the classical differentiable form, obtained from the mean value theorem: the differences are values f'(xi_i) at points that increase with i, so they inherit the bounds and the monotonicity of f'. norm_sum_e2pi_le_of_deriv_sub_int is the form used in practice, f' in [k + lam, k + 1 - lam] for an arbitrary integer k, reduced to the previous one by subtracting k(x - c), which changes no term because k j is an integer. 2026-09-03: RiemannHypothesis/KusminLandauGeneral.lean removes the restriction to a single block. norm_sum_e2pi_le_of_deriv_floor proves, for f' monotone on [c, c+K] and at distance at least lam from every integer, ||sum_{j <= K} e(f(c+j))|| <= (floor(f'(c+K)) - floor(f'(c)) + 1)(1 + 2/lam), by strong induction on the length of the range: the maximal initial block on which floor(f') is constant is bounded by norm_sum_e2pi_le_of_deriv_sub_int uniformly in its length, and past it floor(f') has increased by at least one. norm_sum_e2pi_le_of_deriv_general rewrites the block count as V + 2 with V = |f'(c+K) - f'(c)| the total variation of the derivative, and covers the antitone case by applying the monotone one to -f, whose exponential sum is the complex conjugate. No sorry; axioms exactly propext, Classical.choice, Quot.sound."
    open_boundary: "Only the first derivative test for sums is proved. The A process (Weyl differencing) is proved in M1-WEYL-DIFFERENCING and the third derivative test in M1-VDC-THIRD-DERIVATIVE; the B process (Poisson summation with stationary phase) is still not proved, and without it the exponent pair (1/6, 2/3) yields the Weyl bound zeta(1/2 + i t) = O(t^(1/6+eps)) only conditionally on the approximate functional equation (M1-AFE-SUBCONVEXITY). Since 2026-09-03 the range no longer has to be one in which f' is trapped between two consecutive integers: RiemannHypothesis/KusminLandauGeneral.lean splits a general range, under the sole hypothesis that f' is monotone or antitone and stays at distance at least lam from every integer, and the price is the factor (V + 2) with V the total variation of f'. What is not proved is the sharp constant: (V + 2)(1 + 2/lam) against the classical (V + 1) 2/lam, and the separation hypothesis itself is assumed rather than derived for any particular phase. No consequence for zeta is drawn in the module: no subconvexity bound, no approximate functional equation, no density estimate. The constant is 1 + 2/lam against the classical 2/lam, not optimized."
    milestone: M1
    depends_on: []
