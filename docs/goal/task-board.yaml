    latest_update: "2026-08-28 DONE_STRONG: RiemannHypothesis/WeylPolynomialGeneral.lean removes the hypothesis on the leading coefficient that M1-WEYL-POLYNOMIAL needed, and replaces the sufficient condition by an exact criterion: equidistributedMod1_polyEval_iff proves that the values p(n) of a real polynomial are equidistributed modulo one if and only if some coefficient p.coeff j with j >= 1 is irrational. Two structural lemmas carry the proof. equidistributedMod1_of_sub_int says equidistribution only sees the sequence modulo one, and equidistributedMod1_of_residue_classes glues arithmetic progressions - if every k -> x (v k + r), r < v, is equidistributed then so is x - proved through Weyl sums with sum_range_eq_sum_residues splitting range N into the v progressions, blockCount and lt_blockCount_iff counting each of them exactly. The forward direction is a strong induction on the degree: if the leading coefficient a_D = q is rational, then along n = v m + r with v = q.den the top term is constant modulo one, since v divides (v m + r)^D - r^D and q v = q.num, so the progression differs by an integer from the value sequence of h_r = C (a_D r^D) + (taylor r (eraseLead p)).comp (C v X), of degree at most D - 1; with j0 the largest index with irrational coefficient (Nat.findGreatest), irrational_taylor_coeff shows the j0-th coefficient of taylor r (eraseLead p) is p.coeff j0 plus a rational, and comp_C_mul_X_coeff multiplies by the nonzero rational v^j0, so the induction hypothesis applies. The converse, not_equidistributedMod1_polyEval_of_forall_rat, takes the common denominator L of the coefficients of positive index (exists_common_denom) and observes that e(L p(n)) is constant, so the Weyl sum at frequency L has modulus N. Rationality is handled by the subfield ratSubfield = (Rat.castHom R).fieldRange, whose complement is the irrationals. No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used."
