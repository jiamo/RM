    latest_update: "2026-08-26 DONE_WEAK: RiemannHypothesis/KusminLandau.lean is the sum side of M1-VAN-DER-CORPUT, and like it is absent from mathlib. With e(x) = exp(2 pi i x), norm_sum_e2pi_le proves the purely discrete core: if the consecutive differences d i = u(i+1) - u(i) of a real sequence are monotone in either direction and lie in [lam, 1 - lam] with lam > 0, then ||sum_{j <= K} e(u j)|| <= 1 + 2/lam, with no dependence on K. The proof is summation by parts against the amplitude g i = 1/(e(d i) - 1); the identity 1/(e(x) - 1) = -1/2 - (i/2) cot(pi x) shows the real part of g is constant, so the differences of g are half the differences of cot(pi d), and since cot(pi .) is antitone on (0,1) and d is monotone that sum telescopes; Jordan's inequality sin(pi x) >= 2 lam on [lam, 1 - lam] bounds both the amplitude and the telescoped total. norm_sum_e2pi_le_of_deriv is the classical differentiable form, obtained from the mean value theorem: the differences are values f'(xi_i) at points that increase with i, so they inherit the bounds and the monotonicity of f'. norm_sum_e2pi_le_of_deriv_sub_int is the form used in practice, f' in [k + lam, k + 1 - lam] for an arbitrary integer k, reduced to the previous one by subtracting k(x - c), which changes no term because k j is an integer. No sorry; axioms exactly propext, Classical.choice, Quot.sound."
