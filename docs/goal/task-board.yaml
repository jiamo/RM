  - id: M2-BRUN-TWIN
    priority: P0
    status: DONE_WEAK
    track: analysis
    title: "Brun's twin-prime bound: the two-class sieve from the squarefree large sieve"
    latest_evidence: docs/goal/evidence/2026-09-01-m2-brun-twin.md
    revalidation: docs/goal/evidence/2026-09-01-m2-brun-twin.md
    latest_update: "2026-09-01 DONE_WEAK: RiemannHypothesis/BrunTwinPrimes.lean draws the two-class consequence of Montgomery's inequality of M2-LARGE-SIEVE-SQUAREFREE. twinWeight p is 1 for p = 2 and p - 2 otherwise, and twinSiftSum Q is the sifting sum of the large sieve at those weights, whose odd factors are 2/(p - 2). A twin prime n > Q misses two residue classes modulo every odd prime p <= Q, the class 0 (else p divides the prime n > p) and the class p - 2 (else p divides the prime n + 2 > p), and the class 0 modulo 2, which is twinPrimes_image_card_le; card_mul_twinSiftSum_le is the resulting instance of Montgomery's inequality, |A| twinSiftSum Q <= Q^2 + pi N. The content of the row is the lower bound twinSiftSum Q >> (log Q)^2, in three steps. First, sieveWeight d = prod_{p | d} 1/(p - 1) and the fibre bound sum_inv_primeFactors_eq_le of M2-BRUN-TITCHMARSH give oddSieveTotal X = sum over the odd squarefree d <= X of sieveWeight d >= sum_{m <= X odd} 1/m >= (log X)/2 - 1/2 (half_log_sub_half_le_sum_inv_odd, sum_inv_odd_le_oddSieveTotal). Second, the pairs of odd squarefree numbers up to X that are not coprime have a common odd prime factor p, and sum_sieveWeight_dvd_le bounds the weight of the multiples of p by (1/(p - 1)) oddSieveTotal X, so with sum_inv_sq_odd_primes_le, sum_{p >= 3} 1/(p - 1)^2 <= 7/16, the coprime pairs carry at least 9/16 of oddSieveTotal X squared (nine_sixteenths_le_sum_coprime_pairs). Third, grouping the coprime pairs (a, b) by their product q = ab <= X^2 <= Q, each contributes sieveWeight q by multiplicativity and the fibre has at most 2^omega(q) elements, a squarefree a being determined by its set of prime factors, so the fibre sum is at most prod_{p | q} 2/(p - 1) <= prod_{p | q} 2/(p - 2), the twin factor: sum_coprime_pairs_le_twinSiftSum. Together twinSiftSum_ge, twinSiftSum Q >= (9/16)((log sqrt Q)/2 - 1/2)^2. With Q = floor(sqrt N) and X = floor(sqrt Q) this gives card_twinPrimes_le, at most 900 N/(log N)^2 + sqrt N + 1 integers n < N with n and n + 2 both prime, once log N >= 32. No sorry; axioms exactly propext, Classical.choice, Quot.sound; no unproved Prop of the repository is used."
    open_boundary: "The constant 900 is far from the sharp (8 + o(1)) C_2 of the Selberg sieve: it carries the factor pi of this repository's large sieve in place of 1, the rigid level Q = floor(sqrt N), which halves the logarithm and hence quarters its square, the estimate 9/16 for the coprimality loss in the sifting sum, and the estimate prod_{p | q} 2/(p - 1) in place of the singular series. The threshold log N >= 32 is an artefact of the same additive losses, so nothing is claimed for small N. Only the twin case n, n + 2 is treated: no Hardy-Littlewood pair n, n + 2k, and no lower bound whatsoever - that is the twin-prime conjecture, and it is open. Nothing about zeta follows."
